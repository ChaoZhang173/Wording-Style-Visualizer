[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "token-atlas"
version = "0.1.0"
description = "Explore articles through token representations in different language models."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "MIT"
authors = [{name = "Token Atlas contributors"}]
keywords = ["visualization", "embeddings", "tokens", "language-models", "stylometry"]
dynamic = ["dependencies", "optional-dependencies"]

[project.urls]
Repository = "https://github.com/ChaoZhang173/Wording-Style-Visualizer"
Issues = "https://github.com/ChaoZhang173/Wording-Style-Visualizer/issues"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.dynamic.optional-dependencies]
models = {file = ["requirements-models.txt"]}
pacmap = {file = ["requirements-pacmap.txt"]}

[tool.setuptools.packages.find]
include = ["token_atlas*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
